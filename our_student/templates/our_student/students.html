<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eMobilis Student</title>
    {% load static %}

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

    <!-- Add Student Card -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Add Student</h5>
        </div>
        <div class="card-body">
            <form id="studentForm" class="row g-3">
                <input type="hidden" id="student_id">
                <div class="col-md-3">
                    <label class="form-label">Student No</label>
                    <input type="text" id="stud_no" class="form-control" placeholder="Student No: " required>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Student Name</label>
                    <input type="text" id="stud_name" class="form-control" placeholder="Name: " required>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Age</label>
                    <input type="number" id="stud_age" class="form-control" placeholder="Age: " required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Course</label>
                    <input type="text" id="course" class="form-control" placeholder="Course: " required>
                </div>

                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-success">
                        Add Student
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Students Table -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Our Students</h5>
        </div>
        <div class="card-body">
            <table class="table table-bordered table-striped">
                <thead class="table-secondary">
                    <tr>
                        <th>#</th>
                        <th>Student No</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="students">
            
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="{% static 'js/students.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
