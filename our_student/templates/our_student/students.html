<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eMobilis Student</title>
    {% load static %}

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

</head>

<body>

    <h2>Add Student</h2>

    <form id="studentForm">
        <input type="text" id="stud_no" placeholder="Student No" required>
        <input type="text" id="stud_name" placeholder="Student Name" required>
        <input type="number" id="stud_age" placeholder="Age" required>
        <input type="text" id="course" placeholder="Course" required>
        <button type="submit">Add Student</button>
    </form>

    <hr>

    <!--List Students-->
    <h2>Our Students</h2>
    <ul id="students"></ul>

    <script src="{% static 'js/students.js' %}"></script>

</body>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

</html>
